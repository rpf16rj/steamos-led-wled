name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create release archive
        run: |
          mkdir -p release
          zip -r "release/steamos-led-wled-${{ steps.version.outputs.VERSION }}.zip" \
            server/ \
            leds-valve-shim/ \
            install.sh \
            uninstall.sh \
            README.md \
            README.pt-br.md \
            CHANGELOG.md \
            CHANGELOG.pt-br.md \
            LICENSE \
            .gitignore \
            -x '*.o' '*.ko' '*.mod' '*.mod.c' 'Module.symvers' 'modules.order' '.tmp_versions/*'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            See [CHANGELOG.md](CHANGELOG.md) for details.
          files: release/steamos-led-wled-${{ steps.version.outputs.VERSION }}.zip
          generate_release_notes: false
