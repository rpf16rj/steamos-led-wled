[steamos-led-wled]
# WLED device IP address (required)
wled_host = __WLED_HOST__

# WLED UDP realtime port (default: 21324)
wled_port = __WLED_PORT__

# Number of LEDs on your strip (1-17, remaps Steam Deck's 17 source LEDs)
num_leds = __NUM_LEDS__

# Path to the valve-leds-shim device
device = /dev/valve-leds-shim

# Overlay features (true/false)
# temp_overlay: all LEDs colored by CPU/GPU temperature
temp_overlay = __TEMP_OVERLAY__

# Temperature thresholds in Celsius (overlay activates at warm, blinks at hot)
temp_threshold_warm = 65
temp_threshold_hot = 80

# notify_overlay: flash LEDs on Steam achievements/messages
notify_overlay = __NOTIFY_OVERLAY__

# audio_overlay: VU meter driven by system audio (PipeWire/PulseAudio)
audio_overlay = __AUDIO_OVERLAY__

# VU meter mode: gradient, solid, steam, pulse
#   gradient - color transitions from low to high color across LEDs
#   solid    - all LEDs same color, brightness follows level
#   steam    - Steam Deck blue, brightness follows level
#   pulse    - all LEDs same color, entire bar pulses with audio
audio_mode = gradient

# VU meter direction: ltr, rtl, center
#   ltr    - left to right (low LEDs on left, high on right)
#   rtl    - right to left
#   center - expands from center outward
audio_direction = ltr

# VU meter colors (R,G,B 0-255) for gradient mode
audio_color_low = 0,255,0
audio_color_high = 255,0,0

# VU meter solid color (R,G,B 0-255) for solid/pulse modes
audio_solid_color = 0,174,239

# Power control: send HTTP on/off to WLED on boot/shutdown (like HyperHDR)
wled_power_control = true
