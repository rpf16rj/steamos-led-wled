[steamos-led-wled]
# WLED device IP address (required)
wled_host = __WLED_HOST__

# WLED UDP realtime port (default: 21324)
wled_port = __WLED_PORT__

# Number of LEDs on your strip (1-17, remaps Steam Deck's 17 source LEDs)
num_leds = __NUM_LEDS__

# Path to the valve-leds-shim device
device = /dev/valve-leds-shim

# Overlay features (true/false)
# temp_overlay: color bar by CPU/GPU temperature (yellow > 65C, red > 80C)
temp_overlay = __TEMP_OVERLAY__

# notify_overlay: flash LEDs on Steam achievements/messages
notify_overlay = __NOTIFY_OVERLAY__

# audio_overlay: VU meter driven by system audio (PipeWire/PulseAudio)
audio_overlay = __AUDIO_OVERLAY__

# Power control: send HTTP on/off to WLED on boot/shutdown (like HyperHDR)
wled_power_control = true
